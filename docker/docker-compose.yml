services:

  api:

    build: .

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - redis
      - postgres



  redis:

    image:
      redis:7

    ports:
      - "6379:6379"



  postgres:

    image:
      postgres:16

    environment:

      POSTGRES_USER:
        postgres

      POSTGRES_PASSWORD:
        postgres

      POSTGRES_DB:
        knowledge_db


    ports:

      - "5432:5432"